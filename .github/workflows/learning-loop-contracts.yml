name: brody-image-f0-checks

on:
  push:
    branches:
      - main
      - "f0/**"
    paths:
      - "brody_world_physique/**"
      - "tests/**"
      - "examples/**"
      - "docs/**"
      - "README.md"
      - "requirements-image.txt"
      - ".github/workflows/learning-loop-contracts.yml"
  pull_request:
    branches:
      - main
      - "f0/**"
    paths:
      - "brody_world_physique/**"
      - "tests/**"
      - "examples/**"
      - "docs/**"
      - "README.md"
      - "requirements-image.txt"
      - ".github/workflows/learning-loop-contracts.yml"

permissions:
  contents: read

jobs:
  contracts-and-docs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install image baseline dependency
        run: python -m pip install -r requirements-image.txt
      - name: Compile contracts and tests
        run: python -m compileall -q brody_world_physique tests examples
      - name: Unit tests and image documentation checks
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run bounded synthetic image demonstration
        run: python -m examples.demo_image_v0 --out build/brody-image-demo
      - name: Run bounded synthetic preverbal world experiment
        run: |
          python -m examples.demo_preverbal_world_v0 --out build/preverbal-world-demo
          python -m brody_world_physique.preverbal_prediction_v0 --input build/preverbal-world-demo/source_measurements.json --out build/preverbal-world-demo/verified.json
      - name: Install existing OpenCV decoder for 8-video experiential smoke
        if: matrix.python-version == '3.11'
        run: python -m pip install "opencv-python-headless>=4.8,<5"
      - name: Generate eight videos and test cold one four experiences
        if: matrix.python-version == '3.11'
        run: |
          python -m examples.generate_experience_suite_v0 --out build/experience-demo/suite
          python -m brody_world_physique.experiential_video_v0 --suite build/experience-demo/suite/suite.json --out build/experience-demo/cold --train-videos 0
          python -m brody_world_physique.experiential_video_v0 --suite build/experience-demo/suite/suite.json --out build/experience-demo/one --train-videos 1
          python -m brody_world_physique.experiential_video_v0 --suite build/experience-demo/suite/suite.json --out build/experience-demo/four --train-videos 4
          python -m examples.compare_experience_stages_v0 --cold build/experience-demo/cold/evaluation.json --one build/experience-demo/one/evaluation.json --many build/experience-demo/four/evaluation.json --out build/experience-demo/matched_comparison.json
          python -c "import json,pathlib; p=pathlib.Path('build/experience-demo'); results={n:json.loads((p/n/'evaluation.json').read_text()) for n in ('cold','one','four')}; assert results['cold']['test_predictions']==0 and results['cold']['test_holds_unknown']>0; assert results['one']['training_candidate_transitions']>0 and results['four']['training_candidate_transitions']>results['one']['training_candidate_transitions']; assert all(r['test_memory_mutations']==0 and r['source_kind']=='SIMULATED' and not r['world_knowledge_validated'] for r in results.values()); print('EXPERIENTIAL_SUITE_COLD_ONE_FOUR_PASS')"
      - name: Generate novel transfer videos and assess withheld movement
        if: matrix.python-version == '3.11'
        run: |
          python -m examples.generate_transfer_probes_v1 --out build/transfer-v1/suite
          python -m brody_world_physique.world_transfer_probe_v1 --suite build/transfer-v1/suite/suite.json --out build/transfer-v1/anchored --camera-mode anchored
          python -m brody_world_physique.world_transfer_probe_v1 --suite build/transfer-v1/suite/suite.json --out build/transfer-v1/raw --camera-mode raw_diagnostic
          python -m examples.reverso_future_preview_v1 --suite build/transfer-v1/suite/suite.json --forecasts build/transfer-v1/anchored/forecasts_precommitted.jsonl --out build/transfer-v1/reverso-preview --clip test_01.mp4
          python -c "import json,pathlib; r=pathlib.Path('build/transfer-v1'); a=json.loads((r/'anchored'/'evaluation.json').read_text()); b=json.loads((r/'raw'/'evaluation.json').read_text()); e={x['file']:x for x in a['measurements']}; assert len(e)==6 and a['test_memory_mutations']==0; assert all(not a[k] for k in ('world_knowledge_validated','physical_causality_proven','learned_3d_world')); assert e['test_01.mp4']['predictions']>0 and e['test_02.mp4']['predictions']>0; assert e['test_05.mp4']['holds_conflict']>=1; assert e['test_06.mp4']['missing_heldout']>=1; print('TRANSFER_PROBE_12_VIDEO_PASS')"
      - name: Run image-first drawing school with candidate memory and replay
        if: matrix.python-version == '3.11'
        run: |
          python -m brody_world_physique.drawing_school_v0 --out build/drawing-school-v0
          python -c "import json,pathlib; r=json.loads(pathlib.Path('build/drawing-school-v0/evaluation.json').read_text()); assert len(r['train_lessons'])==3 and len(r['exams'])==4; assert all(x['last_error_pixels']<=x['first_error_pixels'] for x in r['train_lessons']); assert all(x['after_feedback_error_pixels']<=x['candidate_replay_error_pixels'] for x in r['exams']); assert r['ledger_integrity']['verified_records']>3 and r['native_memory_write_allowed'] is False; print('DRAWING_SCHOOL_CANDIDATE_MEMORY_PASS')"
      - name: Run guided pen eraser and curved drawing workshop V1
        if: matrix.python-version == '3.11'
        run: |
          python -m brody_world_physique.drawing_school_v1 --out build/drawing-school-v1
          python -c "import json,pathlib; r=json.loads(pathlib.Path('build/drawing-school-v1/evaluation.json').read_text()); assert len(r['train_lessons'])==4 and len(r['unseen_exams'])==6; assert all(x['final_error']<=x['blank_error'] for x in r['train_lessons']); assert all(x['after_correction_error_pixels']<=x['initial_after_memory_gate'] for x in r['unseen_exams']); assert r['ledger_integrity']['verified_records']>=10 and r['native_memory_write_allowed'] is False and r['semantic_object_understanding'] is False; print('DRAWING_CURVES_ERASER_CANDIDATE_MEMORY_PASS')"
      - name: Replay code-provenance image experiences and readonly memory selection
        if: matrix.python-version == '3.11'
        run: |
          python -m brody_world_physique.experience_memory_v1 --verify build/drawing-school-v1
          python -m brody_world_physique.candidate_skill_retrieval_v1 --memory build/drawing-school-v1 --image build/drawing-school-v1/teacher_images/examen_cercle.png --max-distance 64
          python -c "import json,pathlib; p=pathlib.Path('build/drawing-school-v1'); d=json.loads((p/'evaluation.json').read_text()); e=json.loads((p/'experience_memory_index_v1.json').read_text()); assert e['episode_count']==10; assert d['procedural_experience_memory']['episodes']==10 and d['procedural_experience_memory']['memory_skill_selection_replayed'] is True; assert d['procedural_experience_memory']['all_generated_artifacts_replayed'] is True and d['native_memory_write_allowed'] is False; print('PROCEDURAL_MEMORY_CODE_REPLAY_PASS')"
      - name: Upload visible demonstration and provenance receipt
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: brody-image-i1r1-synthetic-demo
          path: |
            build/brody-image-demo/
            build/preverbal-world-demo/
            build/experience-demo/
            build/transfer-v1/
            build/drawing-school-v0/
            build/drawing-school-v1/
          retention-days: 7
